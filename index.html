<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
    <title>Split Bill Calculator</title>
</head>
<body>
    <h1 class="title">Split Bill Calculator</h1>
    <br><br>
    <form id="splitBillForm">
        <label for="totalBillAmount">Total Bill Amount:</label>
        <input type="number" id="totalBillAmount" name="totalBillAmount" step="0.01" required>
        <br><br>
        <div id="peopleContainer">
            <div class="person-input">
                <label for="person0">Person 1:</label>
                <input type="text" id="person0" class="personName" placeholder="Enter name" required>
            </div>
        </div>
        <button type="button" id="addPersonButton">Add Person</button>
        <button type="submit">Calculate</button>
        <button type="button" id="resetButton">Reset</button>
        <br><br>
        <div id="result"></div>
    </form>
</body>
</html>
